service: payment-service

entries:
  - id: PAY-PROVIDER-TIMEOUT-001
    title: Payment provider authorization timeout
    priority: 100
    updatedAt: 2026-07-03
    severityHints:
      - HIGH
      - CRITICAL
    keywords:
      - timeout
      - provider
      - authorization
      - payment
      - 502
    content: |
      Check primary and secondary payment provider latency and error rates.
      Do not replay authorization requests until idempotency keys are verified.
      Confirm whether provider failover routing is healthy.

  - id: PAY-DUPLICATE-002
    title: Duplicate payment prevention
    priority: 95
    updatedAt: 2026-06-28
    severityHints:
      - HIGH
      - CRITICAL
    keywords:
      - duplicate
      - retry
      - payment
      - timeout
    content: |
      Review retry policy and idempotency-key persistence.
      Prevent manual replay before confirming authorization state.
      Escalate potentially duplicated charges for human review.

  - id: PAY-QUEUE-003
    title: Payment event processing backlog
    priority: 75
    updatedAt: 2026-06-10
    severityHints:
      - MEDIUM
      - HIGH
    keywords:
      - lag
      - queue
      - backlog
      - kafka
    content: |
      Check consumer lag and failed payment-event processing.
      Verify ordering guarantees before increasing consumer concurrency.
      Review failed authorization events before replaying messages.