services:
  order-service:
    businessCriticality: HIGH
    minimumSeverity: MEDIUM

  payment-service:
    businessCriticality: CRITICAL
    minimumSeverity: HIGH

  inventory-service:
    businessCriticality: MEDIUM
    minimumSeverity: MEDIUM

  notification-service:
    businessCriticality: LOW
    minimumSeverity: LOW

severityPolicies:
  LOW:
    acknowledgeWithinMinutes: 60
    notifyChannels:
      - slack-service-channel
    requiresApprovalForRecoveryActions: false
    responseGuidance: >
      Record the incident, monitor error and latency trends,
      and notify the owning service channel.

  MEDIUM:
    acknowledgeWithinMinutes: 30
    notifyChannels:
      - slack-service-channel
      - on-call
    requiresApprovalForRecoveryActions: false
    responseGuidance: >
      Notify the service on-call, investigate dependencies,
      and prepare mitigation options.

  HIGH:
    acknowledgeWithinMinutes: 15
    notifyChannels:
      - on-call
      - slack-incident-channel
    requiresApprovalForRecoveryActions: true
    responseGuidance: >
      Page the primary on-call and create an incident channel.
      Verify customer impact and prepare recovery options.
      Do not perform a write or recovery action without approval.

  CRITICAL:
    acknowledgeWithinMinutes: 5
    notifyChannels:
      - pagerduty
      - slack-war-room
      - sre-manager
    requiresApprovalForRecoveryActions: true
    responseGuidance: >
      Open a war room immediately and page the primary on-call and SRE manager.
      Assign an incident commander and verify the current customer impact.
      Do not perform risky recovery actions without explicit approval.