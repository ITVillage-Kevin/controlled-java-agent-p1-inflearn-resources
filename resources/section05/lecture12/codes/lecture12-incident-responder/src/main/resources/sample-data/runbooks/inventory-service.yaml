service: inventory-service

entries:
  - id: INV-CONSUMER-LAG-001
    title: Inventory synchronization consumer lag
    priority: 95
    updatedAt: 2026-06-25
    severityHints:
      - MEDIUM
      - HIGH
      - CRITICAL
    keywords:
      - lag
      - backlog
      - kafka
      - inventory
      - sync
    content: |
      Check consumer lag by partition and identify poison messages.
      Verify dead-letter queue growth before replaying inventory events.
      Confirm stock reservation consistency before scaling consumers.

  - id: INV-STOCK-MISMATCH-002
    title: Stock reservation mismatch
    priority: 90
    updatedAt: 2026-06-12
    severityHints:
      - HIGH
      - CRITICAL
    keywords:
      - mismatch
      - stock
      - reservation
      - oversell
    content: |
      Compare reserved, available, and committed inventory counts.
      Pause automated stock correction until affected order scope is known.
      Verify whether oversell risk is limited to a specific product group.